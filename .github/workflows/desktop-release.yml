name: Desktop Release Diagnostics

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build, for example v1.2.0. Leave empty to build the selected ref."
        required: false
        type: string

concurrency:
  group: desktop-release-diagnostics-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-desktop:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            electron-target: --linux
            artifact-name: code-ux-linux
          - name: Windows
            os: windows-latest
            electron-target: --win
            artifact-name: code-ux-windows
          - name: macOS
            os: macos-latest
            electron-target: --mac
            artifact-name: code-ux-macos

    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      GH_TOKEN: ""
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.13.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Restore desktop build caches
        uses: actions/cache@v5
        with:
          path: |
            .cache/vite
            .cache/vitest
            .cache/tsc
            .cache/electron-runtime
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: ${{ runner.os }}-node-22-electron-${{ hashFiles('package.json', 'pnpm-lock.yaml', 'vite.config.ts', 'vitest.config.ts', 'tsconfig.json', 'dashboard/tsconfig.json', 'electron-builder.config.cjs', 'scripts/prepare-electron-runtime-deps.mjs') }}

      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libopenjp2-tools xvfb

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run Security Audit
        run: pnpm run audit

      - name: Rebuild Electron native dependencies
        run: pnpm run electron:install-deps

      - name: Build desktop package
        run: pnpm run build && pnpm run electron:prepare-deps && pnpm exec electron-builder --config electron-builder.config.cjs ${{ matrix.electron-target }} --publish never

      - name: Install and start desktop package
        run: pnpm run electron:smoke-installed

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: |
            release/electron/*.dmg
            release/electron/*.zip
            release/electron/*.AppImage
            release/electron/*.deb
            release/electron/*.rpm
            release/electron/*.exe
            release/electron/*.msi
            release/electron/*.pkg
            release/electron/*.tar.gz
            release/electron/*.tar.xz
            release/electron/*.7z
            !release/electron/*-unpacked/**
            !release/electron/builder-debug.yml
            !release/electron/builder-effective-config.yaml
          if-no-files-found: error
