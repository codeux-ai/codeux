name: Code UX CI Pipeline

on:
  push:
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "11.13.0"
  PLAYWRIGHT_BROWSERS_PATH: .cache/ms-playwright

jobs:
  preflight:
    name: 01 Preflight / release policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Enforce main release version bump
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "${EVENT_NAME}" != "pull_request" ] || [ "${BASE_REF}" != "main" ]; then
            echo "Version bump gate applies only to pull requests targeting main."
            exit 0
          fi

          base_version="$(git show "${BASE_SHA}:package.json" | node -e "const fs = require('node:fs'); console.log(JSON.parse(fs.readFileSync(0, 'utf8')).version)")"
          head_version="$(git show "${HEAD_SHA}:package.json" | node -e "const fs = require('node:fs'); console.log(JSON.parse(fs.readFileSync(0, 'utf8')).version)")"

          echo "Base package version: ${base_version}"
          echo "Head package version: ${head_version}"

          node - "${base_version}" "${head_version}" <<'NODE'
          const [, , baseVersion, headVersion] = process.argv;
          const semverPattern = /^(\d+)\.(\d+)\.(\d+)(?:[-+][0-9A-Za-z.-]+)?$/;

          function parseVersion(value, label) {
            const match = semverPattern.exec(value);
            if (!match) {
              throw new Error(`${label} package.json version is not valid semver: ${value}`);
            }
            return match.slice(1, 4).map(Number);
          }

          const base = parseVersion(baseVersion, 'Base');
          const head = parseVersion(headVersion, 'Head');
          const isGreater = head[0] > base[0]
            || (head[0] === base[0] && head[1] > base[1])
            || (head[0] === base[0] && head[1] === base[1] && head[2] > base[2]);

          if (!isGreater) {
            throw new Error(`Main release PRs must bump package.json version above ${baseVersion}; found ${headVersion}.`);
          }
          NODE

  static:
    name: 02 Static / typecheck and guardrails
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Restore node_modules cache
        uses: actions/cache@v5
        with:
          path: node_modules
          key: ${{ runner.os }}-node22-pnpm11.13.0-nm-${{ hashFiles('package.json', 'pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Restore TypeScript caches
        uses: actions/cache@v5
        with:
          path: .cache/tsc
          key: ${{ runner.os }}-node22-pnpm11.13.0-tsc-${{ hashFiles('package.json', 'pnpm-lock.yaml', 'tsconfig.json', 'dashboard/tsconfig.json') }}

      - name: Run quality guardrails
        run: pnpm run quality:guardrails

      - name: Typecheck backend and CLI
        run: pnpm run typecheck

      - name: Typecheck dashboard
        run: pnpm run typecheck:dashboard

  build:
    name: 03 Build / server and dashboard artifact
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Restore node_modules cache
        uses: actions/cache@v5
        with:
          path: node_modules
          key: ${{ runner.os }}-node22-pnpm11.13.0-nm-${{ hashFiles('package.json', 'pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Restore build caches
        uses: actions/cache@v5
        with:
          path: |
            .cache/tsc
            .cache/vite
          key: ${{ runner.os }}-node22-pnpm11.13.0-build-${{ hashFiles('package.json', 'pnpm-lock.yaml', 'vite.config.ts', 'tsconfig.json', 'dashboard/tsconfig.json') }}

      - name: Build server and dashboard
        run: pnpm run build

      - name: Verify build artifact contents
        shell: bash
        run: |
          test -f dist/index.js
          test -f dist/worker/index.js
          test -d dashboard/dist

      - name: Upload compiled app artifact
        uses: actions/upload-artifact@v4
        with:
          name: codeux-build-linux
          path: |
            dist/
            dashboard/dist/
            .cache/tsc/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1

  backend-tests:
    name: 05 Test / backend coverage
    needs: [static, build, security-audit]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Restore node_modules cache
        uses: actions/cache@v5
        with:
          path: node_modules
          key: ${{ runner.os }}-node22-pnpm11.13.0-nm-${{ hashFiles('package.json', 'pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Restore Vitest cache
        uses: actions/cache@v5
        with:
          path: node_modules/.vitest
          key: ${{ runner.os }}-node22-pnpm11.13.0-vitest-backend-${{ hashFiles('package.json', 'pnpm-lock.yaml', 'vitest.config.ts') }}

      - name: Run backend tests with coverage
        run: pnpm run test:backend:coverage

  dashboard-tests:
    name: 06 Test / dashboard suite
    needs: [static, build, security-audit]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Restore node_modules cache
        uses: actions/cache@v5
        with:
          path: node_modules
          key: ${{ runner.os }}-node22-pnpm11.13.0-nm-${{ hashFiles('package.json', 'pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Restore Vitest cache
        uses: actions/cache@v5
        with:
          path: node_modules/.vitest
          key: ${{ runner.os }}-node22-pnpm11.13.0-vitest-dashboard-${{ hashFiles('package.json', 'pnpm-lock.yaml', 'vitest.config.ts') }}

      - name: Run dashboard tests
        run: pnpm run test:dashboard

  security-audit:
    name: 04 Security / dependency audit
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Restore node_modules cache
        uses: actions/cache@v5
        with:
          path: node_modules
          key: ${{ runner.os }}-node22-pnpm11.13.0-nm-${{ hashFiles('package.json', 'pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run security audit
        run: pnpm run audit

  package-smoke:
    name: 07 Package / npm install smoke
    needs: [static, build, security-audit]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Restore node_modules cache
        uses: actions/cache@v5
        with:
          path: node_modules
          key: ${{ runner.os }}-node22-pnpm11.13.0-nm-${{ hashFiles('package.json', 'pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Download compiled app artifact
        uses: actions/download-artifact@v5
        with:
          name: codeux-build-linux
          path: .

      - name: Verify npm tarball install from artifact
        run: node scripts/verify-release-install.mjs
        env:
          CODE_UX_SKIP_RELEASE_INSTALL_BUILD: "1"

  ci-dag:
    name: 08 Orchestration / ${{ matrix.name }} DAG
    needs: [static, build, security-audit]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - name: Linux Docker
            os: ubuntu-latest
            runtime: docker
            command: pnpm run test:orchestration:ci-dag:run
            artifact: orchestration-dag-ubuntu-latest-docker
          - name: macOS Electron
            os: macos-latest
            runtime: electron
            command: pnpm run test:orchestration:ci-dag:electron:run
            artifact: orchestration-dag-macos-latest-electron
          - name: Windows Electron
            os: windows-latest
            runtime: electron
            command: pnpm run test:orchestration:ci-dag:electron:run
            artifact: orchestration-dag-windows-latest-electron
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      GH_TOKEN: ""
      electron_config_cache: ${{ github.workspace }}/.cache/electron-downloads
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Restore node_modules cache
        if: runner.os != 'Windows'
        uses: actions/cache@v5
        with:
          path: node_modules
          key: ${{ runner.os }}-node22-pnpm11.13.0-nm-${{ hashFiles('package.json', 'pnpm-lock.yaml') }}

      - name: Restore Electron caches
        if: matrix.runtime == 'electron'
        uses: actions/cache@v5
        with:
          path: |
            .cache/electron-runtime
            .cache/electron-downloads
          key: ${{ runner.os }}-node22-pnpm11.13.0-electron-dag-${{ hashFiles('package.json', 'pnpm-lock.yaml', 'electron-builder.config.cjs', 'scripts/e2e/run-mockup-sprint-pentest.mjs', 'scripts/e2e/mockup-sprint-pentest-scenarios.mjs', 'scripts/prepare-electron-runtime-deps.mjs') }}
          restore-keys: |
            ${{ runner.os }}-node22-pnpm11.13.0-electron-dag-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Download compiled app artifact
        uses: actions/download-artifact@v5
        with:
          name: codeux-build-linux
          path: .

      - name: Install Electron binary from cache
        if: matrix.runtime == 'electron'
        run: node node_modules/electron/install.js

      - name: Rebuild Electron native dependencies
        if: matrix.runtime == 'electron'
        run: pnpm run electron:install-deps

      - name: Run orchestration validation
        run: ${{ matrix.command }}

      - name: Upload orchestration artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: .cache/e2e-mockup-sprint-pentest/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7

  docs-page-smoke:
    name: 09 Docs / five-page smoke
    needs: [static, build, security-audit]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Restore node_modules cache
        uses: actions/cache@v5
        with:
          path: node_modules
          key: ${{ runner.os }}-node22-pnpm11.13.0-nm-${{ hashFiles('package.json', 'pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Download compiled app artifact
        uses: actions/download-artifact@v5
        with:
          name: codeux-build-linux
          path: .

      - name: Cache Playwright browser binaries
        uses: actions/cache@v5
        with:
          path: .cache/ms-playwright
          key: ${{ runner.os }}-node22-pnpm11.13.0-playwright-${{ hashFiles('package.json', 'pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node22-pnpm11.13.0-playwright-

      - name: Install Playwright dependencies and Chromium
        run: |
          pnpm exec playwright install-deps chromium
          pnpm exec playwright install chromium

      - name: Verify the documentation page sample
        run: pnpm exec playwright test tests/e2e/navigation/docs-page.spec.ts --project=navigation

      - name: Upload Docs smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docs-page-smoke
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  e2e:
    name: 09 E2E / ${{ matrix.os.label }} full (${{ matrix.project }})
    needs: [static, build, security-audit]
    if: ${{ github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.base_ref == 'main' }}
    runs-on: ${{ matrix.os.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        os:
          - runner: ubuntu-latest
            label: Linux
          - runner: macos-latest
            label: macOS
          - runner: windows-latest
            label: Windows
        project: [navigation, settings, projects, tasks, agents, config]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Restore node_modules cache
        if: runner.os != 'Windows'
        uses: actions/cache@v5
        with:
          path: node_modules
          key: ${{ runner.os }}-node22-pnpm11.13.0-nm-${{ hashFiles('package.json', 'pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Download compiled app artifact
        uses: actions/download-artifact@v5
        with:
          name: codeux-build-linux
          path: .

      - name: Cache Playwright browser binaries
        uses: actions/cache@v5
        with:
          path: .cache/ms-playwright
          key: ${{ runner.os }}-node22-pnpm11.13.0-playwright-${{ hashFiles('package.json', 'pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node22-pnpm11.13.0-playwright-

      - name: Install Playwright OS dependencies
        if: runner.os == 'Linux'
        run: pnpm exec playwright install-deps chromium

      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium

      - name: Run Playwright project
        run: pnpm exec playwright test --project=${{ matrix.project }}

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ matrix.os.runner }}-${{ matrix.project }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  release-candidate:
    name: 10 Release Candidate / desktop package (${{ matrix.name }})
    needs: package-smoke
    if: ${{ github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.base_ref == 'main' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            electron-target: --linux
            artifact-name: release-candidate-linux
          - name: macOS
            os: macos-latest
            electron-target: --mac
            artifact-name: release-candidate-macos
          - name: Windows
            # Keep native package build/install validation on the stable Server 2022 image.
            # windows-latest moved to Server 2025 in June 2026, where freshly built unsigned
            # NSIS launchers can terminate with 0xC0000005 before extraction. The Windows
            # orchestration and Playwright lanes still exercise windows-latest separately.
            os: windows-2022
            electron-target: --win
            artifact-name: release-candidate-windows
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      GH_TOKEN: ""
      electron_config_cache: ${{ github.workspace }}/.cache/electron-downloads
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Restore Electron package caches
        uses: actions/cache@v5
        with:
          path: |
            .cache/electron-runtime
            .cache/electron-downloads
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: ${{ runner.os }}-node22-pnpm11.13.0-release-candidate-${{ hashFiles('package.json', 'pnpm-lock.yaml', 'electron-builder.config.cjs', 'scripts/prepare-electron-runtime-deps.mjs') }}
          restore-keys: |
            ${{ runner.os }}-node22-pnpm11.13.0-release-candidate-

      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libopenjp2-tools xvfb

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Download compiled app artifact
        uses: actions/download-artifact@v5
        with:
          name: codeux-build-linux
          path: .

      - name: Install Electron binary from cache
        run: node node_modules/electron/install.js

      - name: Rebuild Electron native dependencies
        run: pnpm run electron:install-deps

      - name: Prepare Electron runtime dependencies
        run: pnpm run electron:prepare-deps

      - name: Build unsigned desktop package
        id: build_desktop_package
        run: pnpm exec electron-builder --config electron-builder.config.cjs ${{ matrix.electron-target }} --publish never

      - name: Install and start release candidate
        id: smoke_installed_candidate
        run: pnpm run electron:smoke-installed

      - name: Upload release candidate artifacts
        if: ${{ always() && steps.build_desktop_package.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: |
            release/electron/*.dmg
            release/electron/*.zip
            release/electron/*.AppImage
            release/electron/*.deb
            release/electron/*.rpm
            release/electron/*.exe
            release/electron/*.msi
            release/electron/*.pkg
            release/electron/*.tar.gz
            release/electron/*.tar.xz
            release/electron/*.7z
            !release/electron/*-unpacked/**
            !release/electron/mac/**
            !release/electron/builder-debug.yml
            !release/electron/builder-effective-config.yaml
          if-no-files-found: error
          retention-days: 7

  legacy-backend-context:
    name: 04 Test / backend coverage
    needs: backend-tests
    if: >-
      ${{
        always() &&
        needs['backend-tests'].result == 'success' &&
        (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.base_ref == 'main')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Confirm current backend gate
        run: echo "Current backend coverage gate passed."

  legacy-dashboard-context:
    name: 05 Test / dashboard suite
    needs: dashboard-tests
    if: >-
      ${{
        always() &&
        needs['dashboard-tests'].result == 'success' &&
        (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.base_ref == 'main')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Confirm current dashboard gate
        run: echo "Current dashboard suite gate passed."

  legacy-security-context:
    name: 06 Security / dependency audit
    needs: security-audit
    if: >-
      ${{
        always() &&
        needs['security-audit'].result == 'success' &&
        (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.base_ref == 'main')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Confirm current security gate
        run: echo "Current dependency audit gate passed."

  legacy-package-context:
    name: 07 Package / npm install smoke (${{ matrix.name }})
    needs: package-smoke
    if: >-
      ${{
        always() &&
        needs['package-smoke'].result == 'success' &&
        (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.base_ref == 'main')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    strategy:
      fail-fast: false
      matrix:
        name: [Linux, Windows, macOS]
    steps:
      - name: Confirm current package gate
        run: echo "Current artifact-backed package smoke gate passed."

  legacy-orchestration-context:
    name: 08 Orchestration / Docker DAG
    needs: ci-dag
    if: >-
      ${{
        always() &&
        needs['ci-dag'].result == 'success' &&
        (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.base_ref == 'main')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Confirm current orchestration matrix
        run: echo "Current cross-platform orchestration matrix passed."

  legacy-e2e-context:
    name: ${{ format('09 E2E / ${0}{0} matrix.os.label {1}{1} full (${0}{0} matrix.project {1}{1})', '{', '}') }}
    needs: e2e
    if: >-
      ${{
        always() &&
        needs.e2e.result == 'success' &&
        (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.base_ref == 'main')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Confirm current E2E matrix
        run: echo "Current 18-shard cross-platform E2E matrix passed."

  legacy-release-candidate-context:
    name: ${{ format('10 Release Candidate / desktop package (${0}{0} matrix.name {1}{1})', '{', '}') }}
    needs: release-candidate
    if: >-
      ${{
        always() &&
        needs['release-candidate'].result == 'success' &&
        (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.base_ref == 'main')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Confirm current release-candidate matrix
        run: echo "Current cross-platform desktop release-candidate matrix passed."
