name: Mockup Sprint Orchestration

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: mockup-sprint-orchestration-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  mockup-sprint-orchestration:
    name: Mockup sprint orchestration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Verify Docker availability
        run: |
          if ! docker version; then
            echo "::error::Docker is required for the mockup sprint orchestration lane."
            exit 1
          fi

      - name: Run full mockup orchestration
        run: pnpm run test:orchestration:full

      - name: Upload mockup sprint orchestration artifacts
        if: ${{ failure() || hashFiles('.cache/e2e-mockup-sprint-pentest/**') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: mockup-sprint-orchestration-artifacts
          path: .cache/e2e-mockup-sprint-pentest/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 5
