name: Mockup Sprint Diagnostics

on:
  workflow_dispatch:

concurrency:
  group: mockup-sprint-diagnostics-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci-dag:
    name: CI DAG
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build runtime for CI DAG
        run: pnpm run build

      - name: Run CI DAG orchestration validation
        run: pnpm run test:orchestration:ci-dag:run

  electron-ci-dag:
    name: Electron CI DAG (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
          - name: Windows
            os: windows-latest

    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      GH_TOKEN: ""
      electron_config_cache: ${{ github.workspace }}/.cache/electron-downloads

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Restore Electron DAG build caches
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/vite
            .cache/vitest
            .cache/tsc
            .cache/electron-runtime
          key: ${{ runner.os }}-node22-pnpm11-electron-ci-dag-${{ hashFiles('package.json', 'pnpm-lock.yaml', 'vite.config.ts', 'tsconfig.json', 'dashboard/tsconfig.json', 'electron-builder.config.cjs', 'scripts/e2e/run-mockup-sprint-pentest.mjs', 'scripts/e2e/mockup-sprint-pentest-scenarios.mjs', 'scripts/prepare-electron-runtime-deps.mjs') }}

      - name: Restore Electron binary cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/electron-downloads
          key: ${{ runner.os }}-node22-pnpm11-electron-binary-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node22-pnpm11-electron-binary-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install Electron binary from cache
        run: node node_modules/electron/install.js

      - name: Rebuild Electron native dependencies
        run: pnpm run electron:install-deps

      - name: Build runtime for Electron CI DAG
        run: pnpm run build

      - name: Run Electron CI DAG orchestration validation
        run: pnpm run test:orchestration:ci-dag:electron:run
