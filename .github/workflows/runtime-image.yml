name: Managed Runtime Image

on:
  pull_request:
    paths:
      - "containers/runtime/**"
      - ".github/workflows/runtime-image.yml"
  push:
    branches: [dev]
    paths:
      - "containers/runtime/**"
      - ".github/workflows/runtime-image.yml"
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: codeux-ai/codeux-runtime
  RUNTIME_CHANNEL: "1"

jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [base, browser]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: containers/runtime/Dockerfile
          target: ${{ matrix.target }}
          load: true
          no-cache: ${{ github.event_name == 'schedule' }}
          tags: codeux-runtime-smoke:${{ matrix.target }}
          cache-from: type=gha,scope=runtime-${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=runtime-${{ matrix.target }}
      - name: Smoke test runtime
        run: |
          docker run --rm --network none codeux-runtime-smoke:${{ matrix.target }} node --version | grep '^v24\.'
          docker run --rm --network none codeux-runtime-smoke:${{ matrix.target }} bash -lc 'command -v git && command -v gh && command -v python3 && command -v pnpm && command -v bun && command -v rg && command -v fd'
          if [ "${{ matrix.target }}" = "browser" ]; then
            docker run --rm --network none codeux-runtime-smoke:browser bash -lc 'command -v playwright && command -v playwright-mcp && command -v xvfb-run && command -v xauth && test -d /ms-playwright && test -z "$(find /ms-playwright -mindepth 1 -print -quit)" && test -z "$(find / -type f -name libwidevinecdm.so -print -quit 2>/dev/null)"'
          fi
      - name: Scan runtime image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          image-ref: codeux-runtime-smoke:${{ matrix.target }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

  publish:
    if: github.event_name != 'pull_request'
    needs: smoke
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [base, browser]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: containers/runtime/Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          no-cache: ${{ github.event_name == 'schedule' }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.RUNTIME_CHANNEL }}-${{ matrix.target }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=runtime-${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=runtime-${{ matrix.target }}
      - name: Sign immutable digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${REGISTRY}/${IMAGE_NAME}@${DIGEST}"
