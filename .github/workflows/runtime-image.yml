name: Managed Runtime Image

on:
  pull_request:
    paths:
      - "containers/runtime/**"
      - ".github/workflows/runtime-image.yml"
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: runtime-image-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: codeux-ai/codeux-runtime
  RUNTIME_CHANNEL: "1"

jobs:
  release-preflight:
    if: github.event_name == 'release' && github.event.action == 'published'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
      - name: Verify release tag and main ancestry
        run: |
          EXPECTED_TAG="v$(node -p "require('./package.json').version")"
          RELEASE_TAG="${{ github.event.release.tag_name }}"
          if [ "$EXPECTED_TAG" != "$RELEASE_TAG" ]; then
            echo "::error::Release tag ($RELEASE_TAG) does not match package.json version ($EXPECTED_TAG)."
            exit 1
          fi
          git fetch origin main --depth=1
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Release tag commit $GITHUB_SHA is not reachable from origin/main."
            exit 1
          fi

  smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [base, browser]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: containers/runtime/Dockerfile
          target: ${{ matrix.target }}
          load: true
          no-cache: ${{ github.event_name == 'release' }}
          tags: codeux-runtime-smoke:${{ matrix.target }}
          cache-from: type=gha,scope=runtime-${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=runtime-${{ matrix.target }}
      - name: Smoke test runtime
        run: |
          docker run --rm --network none codeux-runtime-smoke:${{ matrix.target }} node --version | grep '^v24\.'
          docker run --rm --network none codeux-runtime-smoke:${{ matrix.target }} bash -lc 'command -v git && command -v gh && command -v python3 && command -v pnpm && command -v bun && command -v rg && command -v fd'
          if [ "${{ matrix.target }}" = "browser" ]; then
            docker run --rm --network none codeux-runtime-smoke:browser bash -lc 'command -v playwright && command -v playwright-mcp && command -v xvfb-run && command -v xauth && test -d /ms-playwright && test -z "$(find /ms-playwright -mindepth 1 -print -quit)" && test -z "$(find / -type f -name libwidevinecdm.so -print -quit 2>/dev/null)"'
          fi
      - name: Scan runtime image
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: codeux-runtime-smoke:${{ matrix.target }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

  publish:
    if: github.event_name == 'release' && github.event.action == 'published'
    needs: [release-preflight, smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      matrix:
        target: [base, browser]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@v3.10.0
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: containers/runtime/Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          no-cache: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.RUNTIME_CHANNEL }}-${{ matrix.target }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=runtime-${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=runtime-${{ matrix.target }}
      - name: Sign immutable digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${REGISTRY}/${IMAGE_NAME}@${DIGEST}"
