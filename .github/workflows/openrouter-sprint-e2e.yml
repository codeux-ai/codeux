name: OpenRouter Sprint E2E

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: openrouter-sprint-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CODEUX_E2E_OPENROUTER_MODEL: ${{ vars.CODEUX_E2E_OPENROUTER_MODEL || 'openai/gpt-5-mini' }}

jobs:
  openrouter-sprint-validation:
    name: OpenRouter sprint validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build
        run: pnpm run build

      - name: Run OpenRouter sprint validation
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: node scripts/e2e/run-openrouter-sprint-validation.mjs

      - name: Upload OpenRouter sprint artifacts
        if: ${{ failure() || hashFiles('.cache/e2e-openrouter/**') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openrouter-sprint-e2e-artifacts
          path: .cache/e2e-openrouter/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 5
