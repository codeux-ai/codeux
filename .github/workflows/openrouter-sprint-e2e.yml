name: OpenRouter Sprint E2E

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: openrouter-sprint-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CODEUX_E2E_OPENROUTER_MODEL: ${{ vars.CODEUX_E2E_OPENROUTER_MODEL || 'openai/gpt-5-mini' }}

jobs:
  openrouter-sprint-validation:
    name: OpenRouter sprint validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build
        run: pnpm run build

      - name: Run OpenRouter sprint validation
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: node scripts/e2e/run-openrouter-sprint-validation.mjs

      - name: Upload OpenRouter sprint artifacts
        if: ${{ failure() || hashFiles('.cache/e2e-openrouter/**') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openrouter-sprint-e2e-artifacts
          path: .cache/e2e-openrouter/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 5
