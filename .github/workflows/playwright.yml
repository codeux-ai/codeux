name: Playwright Tests

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: playwright-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  test-e2e:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Restore node_modules cache
        id: nm-cache-e2e
        uses: actions/cache@v5
        with:
          path: node_modules
          key: ${{ runner.os }}-node22-pnpm10.33.0-nm-${{ hashFiles('package.json', 'pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # Cache only Vite's transform cache — NOT the server tsc incremental
      # state (.cache/tsc). The server build runs `tsc --incremental` emitting
      # to dist/, but dist/ is not cached here. Restoring the .tsbuildinfo
      # without its matching dist/ makes incremental tsc consider the output
      # up-to-date and emit nothing, leaving dist/index.js absent — which then
      # crashes the Playwright webServer (`node dist/index.js`). Dropping the
      # tsc cache forces a full server emit on every run.
      - name: Restore Vite cache
        uses: actions/cache@v5
        with:
          path: .cache/vite
          key: ${{ runner.os }}-node22-pnpm10.33.0-vite-e2e-${{ hashFiles('package.json', 'pnpm-lock.yaml', 'vite.config.ts', 'tsconfig.json', 'dashboard/tsconfig.json') }}

      - name: Build server & dashboard
        run: pnpm run build

      - name: Cache Playwright browser binaries
        uses: actions/cache@v5
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-node22-pnpm10.33.0-playwright-${{ hashFiles('package.json', 'pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node22-pnpm10.33.0-playwright-

      - name: Install Playwright browsers and OS dependencies
        run: pnpm exec playwright install chromium --with-deps

      - name: Run Playwright E2E Tests
        run: pnpm exec playwright test

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
