name: Playwright Diagnostics

on:
  workflow_dispatch:

concurrency:
  group: playwright-diagnostics-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PLAYWRIGHT_BROWSERS_PATH: .cache/ms-playwright

jobs:
  build:
    name: Diagnostic build (${{ matrix.os.label }})
    runs-on: ${{ matrix.os.runner }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os:
          - runner: ubuntu-latest
            label: Linux
          - runner: macos-latest
            label: macOS
          - runner: windows-latest
            label: Windows
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.13.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Restore node_modules cache
        if: runner.os != 'Windows'
        uses: actions/cache@v5
        with:
          path: node_modules
          key: ${{ runner.os }}-node22-pnpm11.13.0-nm-${{ hashFiles('package.json', 'pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build server and dashboard
        run: pnpm run build

      - name: Upload compiled app artifact
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostic-build-${{ matrix.os.runner }}
          path: |
            dist/
            dashboard/dist/
          if-no-files-found: error
          retention-days: 1

  test:
    name: Diagnostic E2E (${{ matrix.os.label }} / ${{ matrix.project }})
    needs: build
    runs-on: ${{ matrix.os.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        os:
          - runner: ubuntu-latest
            label: Linux
          - runner: macos-latest
            label: macOS
          - runner: windows-latest
            label: Windows
        project: [navigation, settings, projects, tasks, agents, config]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.13.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Restore node_modules cache
        if: runner.os != 'Windows'
        uses: actions/cache@v5
        with:
          path: node_modules
          key: ${{ runner.os }}-node22-pnpm11.13.0-nm-${{ hashFiles('package.json', 'pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Download compiled app artifact
        uses: actions/download-artifact@v5
        with:
          name: playwright-diagnostic-build-${{ matrix.os.runner }}
          path: .

      - name: Cache Playwright browser binaries
        uses: actions/cache@v5
        with:
          path: .cache/ms-playwright
          key: ${{ runner.os }}-node22-pnpm11.13.0-playwright-${{ hashFiles('package.json', 'pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node22-pnpm11.13.0-playwright-

      - name: Install Playwright OS dependencies
        if: runner.os == 'Linux'
        run: pnpm exec playwright install-deps chromium

      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium

      - name: Run Playwright project
        run: pnpm exec playwright test --project=${{ matrix.project }}

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostic-${{ matrix.os.runner }}-${{ matrix.project }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
