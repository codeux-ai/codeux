name: Release Candidate Diagnostics

on:
  workflow_dispatch:

concurrency:
  group: release-candidate-diagnostics-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  release-checks:
    name: Release checks (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            electron-target: --linux
            artifact-name: release-checks-linux
          - name: macOS
            os: macos-latest
            electron-target: --mac
            artifact-name: release-checks-macos
          - name: Windows
            os: windows-latest
            electron-target: --win
            artifact-name: release-checks-windows

    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      GH_TOKEN: ""

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Restore release check caches
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/vite
            .cache/vitest
            .cache/tsc
            .cache/electron-runtime
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: ${{ runner.os }}-node22-pnpm11-release-checks-${{ hashFiles('package.json', 'pnpm-lock.yaml', 'vite.config.ts', 'tsconfig.json', 'dashboard/tsconfig.json', 'electron-builder.config.cjs', 'scripts/prepare-electron-runtime-deps.mjs', 'scripts/verify-release-install.mjs') }}

      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libopenjp2-tools xvfb

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run Security Audit
        run: pnpm run audit

      - name: Build
        run: pnpm run build

      - name: Verify npm tarball install
        run: node scripts/verify-release-install.mjs

      - name: Rebuild Electron native dependencies
        run: pnpm run electron:install-deps

      - name: Build desktop package
        run: pnpm run electron:prepare-deps && pnpm exec electron-builder --config electron-builder.config.cjs ${{ matrix.electron-target }} --publish never

      - name: Install and start release candidate
        run: pnpm run electron:smoke-installed

      - name: Upload release-check artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact-name }}
          path: |
            release/electron/*.dmg
            release/electron/*.zip
            release/electron/*.AppImage
            release/electron/*.deb
            release/electron/*.rpm
            release/electron/*.exe
            release/electron/*.msi
            release/electron/*.pkg
            release/electron/*.tar.gz
            release/electron/*.tar.xz
            release/electron/*.7z
            !release/electron/*-unpacked/**
            !release/electron/mac/**
            !release/electron/builder-debug.yml
            !release/electron/builder-effective-config.yaml
          if-no-files-found: ignore
